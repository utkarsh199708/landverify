[versions]
springBoot = "4.1.1"
springDependencyManagement = "1.1.7"
spotless = "8.10.2"
jackson = "2.22.3"
victools = "5.0.0"
junit = "6.1.3"
assertj = "3.27.7"
jsonSchemaValidator = "3.0.7"

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }

[libraries]
# Test stack, shared by every module via the root convention (was pinned inline in build.gradle.kts).
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }

# Domain JSON Schema export (libs:domain only).
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-datatype-jdk8 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jdk8", version.ref = "jackson" }
jackson-datatype-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310", version.ref = "jackson" }
victools-generator = { module = "com.github.victools:jsonschema-generator", version.ref = "victools" }
victools-module-jackson = { module = "com.github.victools:jsonschema-module-jackson", version.ref = "victools" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "jsonSchemaValidator" }
