[versions]
springBoot = "3.3.4"
springDependencyManagement = "1.1.6"
spotless = "6.25.0"
jackson = "2.17.2"
victools = "4.36.0"
junit = "5.10.3"
assertj = "3.26.3"
jsonSchemaValidator = "1.5.1"

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }

[libraries]
# Test stack, shared by every module via the root convention (was pinned inline in build.gradle.kts).
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }

# Domain JSON Schema export (libs:domain only).
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-datatype-jdk8 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jdk8", version.ref = "jackson" }
jackson-datatype-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310", version.ref = "jackson" }
victools-generator = { module = "com.github.victools:jsonschema-generator", version.ref = "victools" }
victools-module-jackson = { module = "com.github.victools:jsonschema-module-jackson", version.ref = "victools" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "jsonSchemaValidator" }
