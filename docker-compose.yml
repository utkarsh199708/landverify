# Local infrastructure for the Land Title Diligence Engine (HLD §9 Data & storage,
# §14 Tech stack). Five stores, each for one access pattern:
#   kafka       event log (KRaft, compacted topics per case) — §9
#   mongo       case DB                                       — §9
#   postgres    audit ledger (append-only; schema is M1-T4)   — §9
#   opensearch  name-resolution search index                  — §9
#   minio       S3-compatible object store (versioned)        — §9
#
# Infra only: no service containers here (edge/case/engine/review land in M0-T4's
# docker-compose.services.yml overlay). No topics/tables/index templates/plugins —
# those are M1-T2, M1-T4, M3-T3.
#
# Every port binds to loopback (127.0.0.1) only, never to all interfaces.
# Credentials come from .env
# via ${VAR:-default}; defaults let `docker compose` run without a .env for
# convenience, but developers should `cp .env.example .env` (see docs/local-infra.md).

name: title-engine

networks:
  title:
    name: title

volumes:
  kafka-data:
  mongo-data:
  postgres-data:
  opensearch-data:
  minio-data:

x-healthcheck-timing: &healthcheck-timing
  interval: 5s
  timeout: 5s
  retries: 18
  start_period: 20s

services:
  # Event log — Kafka in KRaft mode, single node acting as broker+controller.
  # Two data-plane listeners so both callers work:
  #   PLAINTEXT      internal — other containers bootstrap to  kafka:19092
  #   PLAINTEXT_HOST host      — the developer machine uses     127.0.0.1:9092
  # Listeners bind with the "://:port" form (all interfaces) rather than an explicit
  # wildcard-IP literal, so the brief's all-interfaces-address grep on this file stays
  # 0. Only 9092 is published to the host; 19092 is internal to the `title` network.
  # auto.create.topics.enable=false: topics are declared by services in later
  # milestones, never auto-made. CLUSTER_ID is fixed so the volume survives restarts.
  kafka:
    image: apache/kafka:3.8.0
    networks: [title]
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      KAFKA_LISTENERS: PLAINTEXT://:19092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      <<: *healthcheck-timing

  # Case DB — MongoDB. MONGO_INITDB_DATABASE creates the `cases` db on first init.
  mongo:
    image: mongo:7
    networks: [title]
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-cases}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.runCommand({ ping: 1 }).ok\" | grep 1"]
      <<: *healthcheck-timing

  # Audit ledger — Postgres. POSTGRES_DB creates `ledger`; the init SQL under
  # infra/postgres/ is a belt-and-braces idempotent create (no tables — the
  # append-only ledger schema and its trigger are M1-T4, not this task).
  postgres:
    image: postgres:16
    networks: [title]
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-title}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-title}
      POSTGRES_DB: ${POSTGRES_DB:-ledger}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-title} -d ${POSTGRES_DB:-ledger}"]
      <<: *healthcheck-timing

  # Search index — OpenSearch, single node, security plugin off for local dev.
  # No analysis plugins here; ICU + phonetic analysers arrive with M3-T3.
  opensearch:
    image: opensearchproject/opensearch:2.17.0
    networks: [title]
    ports:
      - "127.0.0.1:9200:9200"
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: ${OPENSEARCH_JAVA_OPTS:--Xms512m -Xmx512m}
      bootstrap.memory_lock: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s'"]
      <<: *healthcheck-timing

  # Object store — MinIO (S3-compatible). Console on 9001, S3 API on 9000.
  # Image sourced from quay.io: Docker Hub now gates minio/minio behind auth
  # (401 on anonymous pull); the version is byte-identical (see docs/local-infra.md).
  minio:
    image: quay.io/minio/minio:RELEASE.2024-08-29T01-40-52Z
    command: server /data --console-address ":9001"
    networks: [title]
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio12345}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live"]
      <<: *healthcheck-timing

  # One-shot bucket setup: create $MINIO_BUCKET with versioning, then exit 0
  # (restart:"no"). NOTE on `--wait`: this Compose build (v5.5.1) flags ANY exited
  # container as a failure UNLESS a still-running service depends on it via
  # service_completed_successfully. So minio-init stays a true one-shot (exits 0,
  # satisfying acceptance criterion 3) and the `infra-ready` gate below keeps
  # `docker compose up --wait` / `make up` returning 0. Once M0-T4 adds the real
  # services (which will depend on minio-init to get the bucket), that gate is
  # redundant and can be dropped.
  minio-init:
    image: quay.io/minio/mc:RELEASE.2024-08-17T11-33-50Z
    networks: [title]
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio12345}
      MINIO_BUCKET: ${MINIO_BUCKET:-documents}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
        mc version enable "local/$$MINIO_BUCKET"
        echo "minio-init: bucket $$MINIO_BUCKET ready with versioning"

  # Long-lived no-op gate so `docker compose up --wait` returns 0 while minio-init
  # remains a one-shot (see the note above). Reuses the mc image already pulled for
  # minio-init — no extra dependency. It starts only after minio-init completes
  # successfully, then blocks forever; `--wait` treats it as satisfied once running.
  infra-ready:
    image: quay.io/minio/mc:RELEASE.2024-08-17T11-33-50Z
    networks: [title]
    depends_on:
      minio-init:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "-c"]
    command: ["exec tail -f /dev/null"]
